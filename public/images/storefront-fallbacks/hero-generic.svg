<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">VSM storefront generic fallback</title>
  <desc id="desc">Fallback local generico para slides destacados del storefront.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)" />
  <rect x="930" y="180" width="320" height="320" rx="44" fill="#f8fafc" fill-opacity="0.12" stroke="#f8fafc" stroke-opacity="0.28" stroke-width="8"/>
  <rect x="1010" y="260" width="160" height="160" rx="30" fill="#f8fafc" fill-opacity="0.18"/>
  <text x="120" y="700" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="92" font-weight="700" letter-spacing="10">VSM STORE</text>
  <text x="126" y="770" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="30" letter-spacing="8">IMAGEN LOCAL DE RESPALDO</text>
</svg>
