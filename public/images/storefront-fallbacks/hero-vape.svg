<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">VSM vape hero fallback</title>
  <desc id="desc">Fallback local para el hero de dispositivos vape.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#67e8f9" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#67e8f9" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)" />
  <circle cx="1020" cy="330" r="320" fill="url(#glow)" />
  <rect x="1020" y="180" width="180" height="430" rx="90" fill="#e2e8f0" fill-opacity="0.16" stroke="#f8fafc" stroke-opacity="0.35" stroke-width="10" />
  <rect x="1070" y="120" width="80" height="110" rx="38" fill="#f8fafc" fill-opacity="0.2" />
  <rect x="1090" y="290" width="40" height="180" rx="20" fill="#f8fafc" fill-opacity="0.35" />
  <text x="120" y="700" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="92" font-weight="700" letter-spacing="10">VAPE</text>
  <text x="126" y="770" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="30" letter-spacing="8">SELECCION LOCAL ESTABLE</text>
</svg>
