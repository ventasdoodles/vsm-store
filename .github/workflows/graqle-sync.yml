name: GraQle Cloud Sync

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - '.orchestra/**'
      - 'graqle.yaml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cloud_offload_graqle:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install GraQle Ecosystem & Apply Local Patch
        run: |
          python -m pip install --upgrade pip
          pip install graqle google-generativeai supabase httpx
          # Hot-patch: Overwrite installed lib with locally modified code
          LIB_PATH=$(python -c "import graqle; print(graqle.__path__[0])")
          echo "Patching GraQle at: $LIB_PATH"
          cp -r scripts/vendor/graqle/* "$LIB_PATH/"

      - name: Execute GraQle Rebuild
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VITE_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          set -e
          # Protect our patched config files from graq init overwriting them
          cp graqle.yaml graqle.yaml.ours
          cp graqle.json graqle.json.bak 2>/dev/null || true

          echo "=== Phase 1: Build graph structure ==="
          if [ -f graqle.json ] && [ -s graqle.json ]; then
            echo "Existing graph found. Running graq grow..."
            graq grow || true
          else
            echo "No graph found. Running graq init..."
            graq init || true
          fi

          echo "=== Phase 2: Restore our config ==="
          cp graqle.yaml.ours graqle.yaml
          echo "graqle.yaml restored to our patched version."

          echo "=== Phase 3: Rebuild embeddings with Gemini ==="
          if [ -f graqle.json ] && [ -s graqle.json ]; then
            graq rebuild || echo "WARNING: rebuild failed, keeping existing graph"
          else
            echo "ERROR: No graph produced. Restoring backup."
            cp graqle.json.bak graqle.json 2>/dev/null || true
            exit 1
          fi

          echo "=== Done ==="
          echo "Graph file size: $(wc -c < graqle.json) bytes"

      - name: Commit & Push Updated Graph
        run: |
          rm -f graqle.json.bak graqle.yaml.ours
          # Restore graqle.yaml to repo version (undo any init overwrites)
          git checkout -- graqle.yaml 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f graqle.json
          git diff --staged --quiet || git commit -m "chore(graqle): update knowledge graph [skip ci]"
          git push
