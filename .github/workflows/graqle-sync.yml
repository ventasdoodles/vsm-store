name: GraQle Cloud Sync

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - '.orchestra/**'
      - 'graqle.yaml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cloud_offload_graqle:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install GraQle Ecosystem & Apply Local Patch
        run: |
          python -m pip install --upgrade pip
          pip install graqle google-generativeai supabase
          # Hot-patch: Overwrite installed lib with locally modified code
          LIB_PATH=$(python -c "import graqle; print(graqle.__path__[0])")
          echo "Patching GraQle at: $LIB_PATH"
          cp -r scripts/vendor/graqle/* "$LIB_PATH/"

      - name: Execute GraQle Grow or Init
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          echo "Forcing full GraQle graph rebuild in Cloud..."
          graq rebuild

      - name: Commit & Push Updated Graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f graqle.json
          git diff --staged --quiet || git commit -m "chore(graqle): update knowledge graph [skip ci]"
          git push

