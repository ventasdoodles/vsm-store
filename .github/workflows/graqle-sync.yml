name: GraQle Cloud Sync

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - '.orchestra/**'
      - 'graqle.yaml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cloud_offload_graqle:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install GraQle Ecosystem
        run: |
          python -m pip install --upgrade pip
          pip install graqle google-generativeai supabase

      - name: Execute GraQle Grow (Incremental Scan)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: graq grow

      - name: Commit & Push Updated Graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f graqle.json
          git diff --staged --quiet || git commit -m "chore(graqle): update knowledge graph [skip ci]"
          git push

