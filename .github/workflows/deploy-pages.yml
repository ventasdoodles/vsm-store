name: Deploy Storefront to Cloudflare Pages

on:
  # Manual-only parallel deploy mechanism for controlled releases.
  # Cloudflare secrets are active; last successful run: 25918704188.
  # Actions runtime: Node 24. App build: Node 22 LTS.
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_PAGES_PROJECT: vsm-store
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Verify Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID secret"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN secret"; exit 1; }

      - name: Install dependencies
        run: npm ci

      - name: Build release artifact
        run: npm run build

      - name: Upload deploy artifact
        uses: actions/upload-artifact@v6
        with:
          name: storefront-dist
          path: dist
          if-no-files-found: error

      - name: Deploy dist to Cloudflare Pages
        env:
          WRANGLER_SEND_METRICS: "false"
        run: >
          npx --yes wrangler pages deploy dist
          --project-name "$CLOUDFLARE_PAGES_PROJECT"
          --branch "${GITHUB_REF_NAME}"
          --commit-hash "${GITHUB_SHA}"
