name: Run Knowledge Ingestion

on:
  workflow_dispatch: # Allows manual trigger
    inputs:
      source_ids:
        description: 'Optional comma-separated store_knowledge source_id allowlist'
        required: false
        type: string

jobs:
  ingest:
    runs-on: ubuntu-latest

    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || secrets.SUPABASE_URL }}
      VITE_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.VITE_SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Check Secrets
        run: |
          MISSING=()
          if [ -z "${{ secrets.VITE_SUPABASE_URL }}${{ secrets.SUPABASE_URL }}" ]; then MISSING+=("SUPABASE_URL"); fi
          if [ -z "${{ secrets.VITE_SUPABASE_SERVICE_ROLE_KEY }}${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" ]; then MISSING+=("SUPABASE_SERVICE_ROLE_KEY"); fi
          if [ -z "${{ secrets.GEMINI_API_KEY }}" ]; then MISSING+=("GEMINI_API_KEY"); fi
          
          if [ ${#MISSING[@]} -ne 0 ]; then
            echo "❌ ERROR: The following secrets are missing in GitHub Settings > Secrets and variables > Actions:"
            for secret in "${MISSING[@]}"; do
              echo "  - $secret"
            done
            echo ""
            echo "Please add them to your repository secrets to continue."
            exit 1
          fi

      - name: Install dependencies
        run: npm install # Using install instead of ci to be more flexible with lockfiles

      - name: Run Knowledge Ingestor
        env:
          SOURCE_IDS: ${{ inputs.source_ids }}
        run: |
          ARGS=()
          if [ -n "$SOURCE_IDS" ]; then
            ARGS+=("--sources=$SOURCE_IDS")
          fi
          npx tsx supabase/seeds/seed_runner.ts "${ARGS[@]}"
