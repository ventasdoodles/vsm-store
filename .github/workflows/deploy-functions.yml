name: Deploy Supabase Edge Functions

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/**'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup toolchain
        uses: supabase/setup-cli@df56b21da46c98abb12a9804e4fb1f657773e333
        with:
          version: latest

      - name: Deploy bundle-intelligence
        run: supabase functions deploy bundle-intelligence --project-ref $PROJECT_ID

      - name: Deploy cesarin-qa-judge
        run: supabase functions deploy cesarin-qa-judge --project-ref $PROJECT_ID

      - name: Deploy checkout-submit
        run: supabase functions deploy checkout-submit --project-ref $PROJECT_ID

      - name: Deploy create-payment
        run: supabase functions deploy create-payment --project-ref $PROJECT_ID

      - name: Deploy customer-intelligence
        run: supabase functions deploy customer-intelligence --project-ref $PROJECT_ID

      - name: Deploy customer-narrative
        run: supabase functions deploy customer-narrative --project-ref $PROJECT_ID

      - name: Deploy dashboard-intelligence
        run: supabase functions deploy dashboard-intelligence --project-ref $PROJECT_ID

      - name: Deploy embeddings-processor
        run: supabase functions deploy embeddings-processor --project-ref $PROJECT_ID

      - name: Deploy inventory-oracle
        run: supabase functions deploy inventory-oracle --project-ref $PROJECT_ID

      - name: Deploy knowledge-ingestor
        run: supabase functions deploy knowledge-ingestor --project-ref $PROJECT_ID

      - name: Deploy loyalty-intelligence
        run: supabase functions deploy loyalty-intelligence --project-ref $PROJECT_ID

      - name: Deploy mercadopago-webhook
        run: supabase functions deploy mercadopago-webhook --project-ref $PROJECT_ID --no-verify-jwt

      - name: Deploy product-intelligence
        run: supabase functions deploy product-intelligence --project-ref $PROJECT_ID

      - name: Deploy track-shipment
        run: supabase functions deploy track-shipment --project-ref $PROJECT_ID

      - name: Deploy voice-intelligence
        run: supabase functions deploy voice-intelligence --project-ref $PROJECT_ID
