name: Deploy Supabase Edge Functions

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/**'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup toolchain
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy knowledge-ingestor
        run: supabase functions deploy knowledge-ingestor --project-ref $PROJECT_ID --no-verify-jwt

      - name: Deploy create-payment
        run: supabase functions deploy create-payment --project-ref $PROJECT_ID

      # We can add other functions here if needed, or use a script to deploy all.
      # For now, we explicitly deploy the new one.
