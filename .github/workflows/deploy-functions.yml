name: Deploy Supabase Edge Functions

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/**'
    paths-ignore:
      - '**.md'
      - 'supabase/functions/**/*.test.*'
      - 'supabase/functions/**/*.spec.*'
  workflow_dispatch:
    inputs:
      function_name:
        description: 'Specific function to deploy (e.g. create-payment, or "all")'
        required: false
        default: 'all'

concurrency:
  group: deploy-edge-functions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Setup toolchain
        uses: supabase/setup-cli@df56b21da46c98abb12a9804e4fb1f657773e333
        with:
          version: latest

      - name: Deploy Modified or Selected Edge Functions
        run: |
          set -euo pipefail

          FUNCTIONS_TO_DEPLOY=()

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGET="${{ inputs.function_name }}"
            if [ -n "$TARGET" ] && [ "$TARGET" != "all" ]; then
              if [ -d "supabase/functions/$TARGET" ]; then
                FUNCTIONS_TO_DEPLOY=("$TARGET")
              else
                echo "❌ ERROR: Function '$TARGET' does not exist in supabase/functions/"
                exit 1
              fi
            fi
          fi

          if [ ${#FUNCTIONS_TO_DEPLOY[@]} -eq 0 ]; then
            SHARED_CHANGED=false
            if git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
              CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD -- supabase/functions/)
              if echo "$CHANGED_FILES" | grep -q "^supabase/functions/_shared/"; then
                SHARED_CHANGED=true
                echo "ℹ️ supabase/functions/_shared/ modified: will deploy all functions."
              fi
            else
              SHARED_CHANGED=true
              echo "ℹ️ Single commit / no parent HEAD~1 found: will deploy all functions."
            fi

            if [ "$SHARED_CHANGED" = true ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              for d in supabase/functions/*/; do
                fn=$(basename "$d")
                if [ "$fn" != "_shared" ] && [ -f "$d/index.ts" ]; then
                  FUNCTIONS_TO_DEPLOY+=("$fn")
                fi
              done
            else
              CHANGED_FNS=$(echo "$CHANGED_FILES" | grep -oE "^supabase/functions/[^/]+" | sed 's#^supabase/functions/##' | grep -v '^_shared$' | sort -u || true)
              for fn in $CHANGED_FNS; do
                if [ -d "supabase/functions/$fn" ] && [ -f "supabase/functions/$fn/index.ts" ]; then
                  FUNCTIONS_TO_DEPLOY+=("$fn")
                fi
              done
            fi
          fi

          echo "=========================================="
          echo "Edge Functions to deploy: ${#FUNCTIONS_TO_DEPLOY[@]}"
          for fn in "${FUNCTIONS_TO_DEPLOY[@]}"; do
            echo "  - $fn"
          done
          echo "=========================================="

          if [ ${#FUNCTIONS_TO_DEPLOY[@]} -eq 0 ]; then
            echo "No edge function deployment needed. Skipping."
            exit 0
          fi

          for fn in "${FUNCTIONS_TO_DEPLOY[@]}"; do
            echo ""
            echo "🚀 Deploying: $fn"
            EXTRA_FLAGS=""
            if [ "$fn" = "mercadopago-webhook" ]; then
              EXTRA_FLAGS="--no-verify-jwt"
            fi
            supabase functions deploy "$fn" --project-ref "$PROJECT_ID" $EXTRA_FLAGS
          done
