# Nivel de Razonamiento: PRO (March 2026) -> LLAVE EN NUBE
# Trigger CI Pipeline (Force install dependencies)

model:
  backend: gemini
  model: gemini-2.5-pro
  api_key: "${VITE_GEMINI_API_KEY}"

embeddings:
  backend: local
  model: BAAI/bge-m3
  api_key: "${VITE_GEMINI_API_KEY}"

graph:
  connector: networkx

activation:
  strategy: chunk
  max_nodes: 5
  embedding_model: BAAI/bge-m3

orchestration:
  max_rounds: 3
  convergence_threshold: 0.92

cost:
  budget_per_query: 0.1
  dynamic_ceiling: true

governance:
  enabled: true

routing:
  default_provider: gemini
  rules:
  - task: reason
    provider: gemini